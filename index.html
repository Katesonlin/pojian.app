<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Relay - Kateson</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .status {
      font-size: 80px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #00d4ff;
    }
    .subtitle {
      font-size: 16px;
      color: #888;
      margin-bottom: 40px;
    }
    .info {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      margin: 0 auto;
      text-align: left;
    }
    .info h3 {
      color: #00d4ff;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .info p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .info code {
      background: #2a2a2a;
      padding: 2px 8px;
      border-radius: 4px;
      color: #00d4ff;
      font-family: monospace;
    }
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status pulse">🦐</div>
    <div class="title">Browser Relay Active</div>
    <div class="subtitle">Katesonlin's Tunnel</div>
    <div class="info">
      <h3>连接状态</h3>
      <p>✅ SSH 隧道已建立</p>
      <p>✅ Extension 已连接</p>
      <p>📡 转发端口: <code>18789</code></p>
      <p style="margin-top: 16px; font-size: 12px; color: #666;">
        最后更新: 2026-04-09
      </p>
    </div>
  </div>
</body>
</html>
